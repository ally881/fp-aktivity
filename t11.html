<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aktivity – Finančné plánovanie</title>
<style>
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface2:#eef3f9; --ink:#0b1f3a; --ink2:#4a5b73; --line:#d6dfea;

  --radius:14px; --shadow:0 1px 2px rgba(11,31,58,.06),0 4px 14px rgba(11,31,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1520; --surface:#16212f; --surface2:#1c2a3b; --ink:#e8eef6; --ink2:#a6b4c6; --line:#2a3a4f;

  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header.top{background:var(--ink);color:#fff;padding:14px 16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0a1018}}
header.top .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
header.top .plane{font-size:22px}
header.top small{display:block;opacity:.75;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
header.top b{font-size:16px;line-height:1.25}
h1{font-size:22px;line-height:1.25;margin:4px 0 8px}
h2{font-size:18px;margin:20px 0 8px}
p{margin:6px 0}
.muted{color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.tile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.tile .meta{font-size:13px;color:var(--ink2)}
.done-badge{margin-left:auto;font-size:13px;font-weight:600;color:var(--ok);white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);margin:0 4px 4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{background:none;border:none;color:var(--accent);cursor:pointer;padding:8px 0;font-weight:600}
details.theory{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
details.theory summary{cursor:pointer;font-weight:600;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:40px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:14px}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.item.ok{border-color:var(--ok)} .item.ko{border-color:var(--bad)}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:14px}
.fb.ok{background:var(--ok-soft)} .fb.ko{background:var(--bad-soft)} .fb.mid{background:var(--warn-soft)}
.src{font-size:12px;color:var(--ink2);margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
.tbl{overflow-x:auto;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--surface2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.kpi{background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:13px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.opt{display:block;width:100%;text-align:left;min-height:48px;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt:disabled{cursor:default}
.pts{font-weight:700}
.order li{display:flex;align-items:center;gap:8px;list-style:none;margin:8px 0}
.order ol{padding:0;margin:0}
.order .txt{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.order .txt.ok{border-color:var(--ok);background:var(--ok-soft)} .order .txt.ko{border-color:var(--bad);background:var(--bad-soft)}
.order .mv{display:flex;flex-direction:column;gap:4px}
.order .mv button{width:40px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
input[type=text]{width:100%;max-width:220px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.alloc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:10px 0}
.alloc input[type=range]{grid-column:1/3;width:100%;accent-color:var(--accent);height:28px}
.alloc .pct{font-weight:700;font-variant-numeric:tabular-nums}
.sum{font-weight:700}
.sum.bad{color:var(--bad)} .sum.good{color:var(--ok)}
.score{font-size:28px;font-weight:800;color:var(--accent)}
.menti{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:var(--radius);padding:14px;margin:14px 0}
.menti .code{font-size:24px;font-weight:800;letter-spacing:.08em}
.big{font-size:20px;font-weight:700}
svg.chart{width:100%;height:auto;display:block}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0}
.progress span{display:block;height:100%;background:var(--accent)}
footer{font-size:12px;color:var(--ink2);text-align:center;margin-top:28px}
</style>
</head>

function srcLine(s){ return s ? h('div', {class:'src', text:'Zdroj: ' + s}) : null; }
function table(t){

  return h('div', {class:'tbl'}, h('table', null,
    h('thead', null, h('tr', null, t.hlavicka.map(function(c){ return h('th', {text:c}); }))),
    h('tbody', null, (t.riadky||[]).map(function(r){ return h('tr', null, r.map(function(c, i){ return h('td', {class: i>0 && isNum(c) ? 'n' : null, text:c}); })); }))
  ));

var RENDER = {};

/* ---------- triedenie / pravda_nepravda ---------- */
function classify(items, cats, getRight, onDone){
  return function(a, d, body, done){
    var list = shuffle(items(d)), choice = {}, cards = [];
    var check = h('button', {class:'btn primary', disabled:true, onclick: evaluate}, 'Vyhodnotiť');
    var counter = h('span', {class:'muted'});
    function upd(){ var n = Object.keys(choice).length; counter.textContent = n + ' / ' + list.length + ' zaradených'; check.disabled = n < list.length; }
    list.forEach(function(it, i){
      var chips = cats(d).map(function(c){
        var b = h('button', {class:'chip', onclick: function(){ if (check.dataset.done) return; choice[i] = c; chips.forEach(function(x){ x.classList.toggle('sel', x.textContent === c); }); upd(); }}, c);
        return b;
      });
      var card = h('div', {class:'card item'}, h('div', {text: it.text}), h('div', {class:'chips'}, chips));
      cards.push({card:card, chips:chips, it:it}); body.appendChild(card);
    });
    body.appendChild(h('div', {class:'row'}, check, counter)); upd();
    function evaluate(){
      check.dataset.done = '1'; check.disabled = true; var ok = 0;
      cards.forEach(function(c, i){
        var right = getRight(c.it), good = choice[i] === right; if (good) ok++;
        c.card.classList.add(good ? 'ok' : 'ko');
        c.chips.forEach(function(x){ x.classList.remove('sel'); if (x.textContent === right) x.classList.add('right'); else if (x.textContent === choice[i]) x.classList.add('wrong'); x.disabled = true; });
        c.card.appendChild(h('div', {class:'fb ' + (good?'ok':'ko')}, h('b', {text: good ? '✓ Správne. ' : '✗ Správne je: ' + right + '. '}), c.it.vysvetlenie || ''));
        add(c.card, srcLine(c.it.zdroj));
      });
      done(ok, cards.length);
    }
  };
}
RENDER.triedenie = classify(function(d){ return d.polozky||[]; }, function(d){ return d.kategorie||[]; }, function(it){ return it.spravne; });
RENDER.pravda_nepravda = classify(function(d){ return d.tvrdenia||[]; }, function(){ return ['Pravda','Nepravda']; }, function(it){ return it.pravda ? 'Pravda' : 'Nepravda'; });

/* ---------- poradie ---------- */

        finished && ci !== pos ? h('div', {class:'src', text:'Správna pozícia: ' + (ci+1)}) : null),
        finished ? null : h('div', {class:'mv'},

    body.appendChild(exp); done(ok, correct.length);

/* ---------- rozhodnutie ---------- */
RENDER.rozhodnutie = function(a, d, body, done){

  function drawKpi(changes){
    clear(kpiBox);

      var ch = changes && changes[name], dt = ch ? (ch > 0 ? ' ▲' + fmt(ch) : ' ▼' + fmt(-ch)) : '';
      kpiBox.appendChild(h('div', {class:'kpi'}, name, h('b', null, fmt(kpi[name]), dt ? h('small', {style:'color:var(' + (ch>0?'--ok':'--bad') + ');font-size:13px', text: dt}) : null)));

        if (p < best){ var bo = s.moznosti.filter(function(x){ return (Number(x.body)||0) === best; })[0]; if (bo) card.appendChild(h('div', {class:'src', text:'Najlepšia voľba: ' + bo.text})); }
        card.appendChild(h('div', {class:'row', style:'margin-top:10px'}, h('button', {class:'btn primary', onclick: function(){ this.remove(); step(i+1); }}, i+1 < steps.length ? 'Ďalšie rozhodnutie →' : 'Zobraziť výsledok')));

/* ---------- vypocet ---------- */
RENDER.vypocet = function(a, d, body, done){
  if (d.situacia || d.tabulka) body.appendChild(h('div', {class:'card'}, d.situacia ? h('p', {text: d.situacia}) : null, table(d.tabulka)));
  var qs = d.otazky || [], state = qs.map(function(){ return {tries:0, ok:false, closed:false}; }), score = 0;
  qs.forEach(function(q, i){
    var inp = h('input', {type:'text', inputmode:'decimal', placeholder:'výsledok', 'aria-label': q.text});
    var fbBox = h('div');
    var chk = h('button', {class:'btn primary small', onclick: check}, 'Skontrolovať');
    var show = h('button', {class:'btn small', onclick: reveal}, 'Ukáž postup');
    var card = h('div', {class:'card'}, h('b', {text: (i+1) + '. ' + q.text}),
      h('div', {class:'row', style:'margin-top:8px'}, inp, h('span', {text: q.jednotka || ''})), h('div', {class:'row', style:'margin-top:8px'}, chk, show), fbBox);

    var pl = document.createElementNS(ns, 'polyline'); pl.setAttribute('points', pts.map(function(p){ return p.join(','); }).join(' ')); pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'var(--accent)'); pl.setAttribute('stroke-width', '2.5'); svg.appendChild(pl);
    pts.forEach(function(p, i){ var c = document.createElementNS(ns, 'circle'); c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 3.5); c.setAttribute('fill', 'var(--accent)'); svg.appendChild(c);
      var t = document.createElementNS(ns, 'text'); t.setAttribute('x', p[0]); t.setAttribute('y', H-6); t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '10'); t.setAttribute('fill', 'var(--ink2)'); t.textContent = i === 0 ? 'štart' : (rounds[i-1] ? rounds[i-1].nazov : ''); svg.appendChild(t); });
    return svg;
  }
  roundUI();
};

/* ---------- router ---------- */
function go(id){
  var before = location.hash;
  try { location.hash = id || ''; } catch(e) {}
  if (location.hash === before || location.hash.replace('#','') !== (id || '')) route(id || '');
}
function route(force){
  var id = typeof force === 'string' ? force : (location.hash || '').replace('#', ''), list = D.aktivity || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return activity(list[i], i);
  menu();
}
window.addEventListener('hashchange', function(){ route(); });
route();
})();
</script>
